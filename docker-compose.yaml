services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - analytics
    depends_on:
      - gtcd
      - goatcounter

  goatcounter:
    image: arp242/goatcounter:latest
    expose:
      - "8080"
    networks:
      - analytics
    volumes:
      - goatcounter-data:/var/lib/goatcounter

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    networks:
      - analytics
    volumes:
      - redis-data:/data

  gtcd:
    build: .
    env_file: .env
    environment:
      GOATCOUNTER_URL: ${GOATCOUNTER_URL:-http://goatcounter:8080}
      SESSION_SECRET: ${SESSION_SECRET:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    expose:
      - "3000"
    depends_on:
      - goatcounter
      - redis
    networks:
      - analytics

volumes:
  goatcounter-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  analytics:
