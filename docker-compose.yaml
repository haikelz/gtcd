services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - analytics
    depends_on:
      - gtcd
      - goatcounter

  goatcounter:
    image: arp242/goatcounter:latest
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - analytics
    volumes:
      - goatcounter-data:/var/lib/goatcounter

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass lives in secrets/redis.conf (generated by scripts/setup.sh,
    # gitignored); it never appears in this file or the image.
    command: ["redis-server", "/run/secrets/redis.conf"]
    secrets:
      - source: redis_conf
        target: redis.conf
    expose:
      - "6379"
    networks:
      - analytics
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning
          -a "$$(sed -n 's/^requirepass //p' /run/secrets/redis.conf)"
          ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

  gtcd:
    build: .
    env_file: .env
    environment:
      GOATCOUNTER_URL: ${GOATCOUNTER_URL:-http://goatcounter:8080}
      # Must carry the password from secrets/redis.conf, e.g.
      # redis://:<REDIS_PASSWORD>@redis:6379 (scripts/setup.sh writes it).
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env with the password from secrets/redis.conf}
      # Derive the public origin from the reverse proxy's headers so CSRF
      # origin checks and cookie flags work for both http://localhost and
      # TLS production domains without per-deployment ORIGIN configuration.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: host
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      goatcounter:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - analytics

volumes:
  goatcounter-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  analytics:

secrets:
  redis_conf:
    file: ./secrets/redis.conf
