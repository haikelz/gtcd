services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - analytics
    depends_on:
      - gtcd
      - goatcounter

  goatcounter:
    # Pinned release (multi-arch index digest). Check the running version
    # before changing it: an older pin than the database schema is a downgrade.
    # See docs/GOATCOUNTER_OPERATIONS.md#goatcounter-image-pin.
    image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
    restart: unless-stopped
    # The image's default command plus the API limit; gtcd below paces itself
    # to the same GOATCOUNTER_API_RATE (GoatCounter's own default is 4).
    # serve creates a missing database, so an upgrade from the old volume
    # layout would start empty; the check refuses that unless setup.sh marked
    # a new install. See docs/GOATCOUNTER_OPERATIONS.md#compose-storage.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f goatcounter-data/db.sqlite3 ] && [ "$$GTCD_NEW_INSTALL" != 1 ]; then
          echo "No database in the goatcounter-data volume. Upgrading? Move the old data first: docs/GOATCOUNTER_OPERATIONS.md#compose-storage" >&2
          exit 1
        fi
        exec goatcounter serve -automigrate -ratelimit "api:${GOATCOUNTER_API_RATE:-20}/1"
    environment:
      # maxmind:<account_id>:<license_key> downloads the GeoLite2 City database
      # for regional reporting; empty keeps the built-in Countries database.
      # A failed download stops GoatCounter. See .env.example.
      GOATCOUNTER_GEODB: ${GOATCOUNTER_GEODB:-}
      # Not GOATCOUNTER_*: serve exits on variables it does not know.
      GTCD_NEW_INSTALL: ${GTCD_NEW_INSTALL:-}
    expose:
      - "8080"
    networks:
      - analytics
    volumes:
      # The image's data directory (db.sqlite3, GeoIP files).
      - goatcounter-data:/home/goatcounter/goatcounter-data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # requirepass lives in secrets/redis.conf (generated by scripts/setup.sh,
    # gitignored); it never appears in this file or the image.
    command: ["redis-server", "/run/secrets/redis.conf"]
    secrets:
      - source: redis_conf
        target: redis.conf
    expose:
      - "6379"
    networks:
      - analytics
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          redis-cli --no-auth-warning
          -a "$$(sed -n 's/^requirepass //p' /run/secrets/redis.conf)"
          ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10

  gtcd:
    build: .
    restart: unless-stopped
    # Above scripts/start.mjs's 25s shutdown bound (Docker's default is 10s).
    stop_grace_period: 30s
    env_file: .env
    environment:
      GOATCOUNTER_URL: ${GOATCOUNTER_URL:-http://goatcounter:8080}
      GOATCOUNTER_API_RATE: ${GOATCOUNTER_API_RATE:-20}
      # Must carry the password from secrets/redis.conf, e.g.
      # redis://:<REDIS_PASSWORD>@redis:6379 (scripts/setup.sh writes it).
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env with the password from secrets/redis.conf}
      # Derive the public origin from the reverse proxy's headers so CSRF
      # origin checks and cookie flags work for both http://localhost and
      # TLS production domains without per-deployment ORIGIN configuration.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: host
      # Client IP for the per-IP login rate limit. Caddy fronts gtcd, so the
      # last X-Forwarded-For entry is the client. Behind Cloudflare, set
      # ADDRESS_HEADER=cf-connecting-ip in .env instead.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      goatcounter:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - analytics

volumes:
  goatcounter-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  analytics:

secrets:
  redis_conf:
    file: ./secrets/redis.conf
