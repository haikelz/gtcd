apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
  labels:
    app: goatcounter
spec:
  replicas: 1
  # SQLite has one writer; do not overlap old/new pods during migrations.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: goatcounter
  template:
    metadata:
      labels:
        app: goatcounter
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Refreshes MaxMind's GeoLite2 City database on every pod start so
        # GoatCounter can record regions. Optional: without the
        # goatcounter-geoip Secret, or when MaxMind is unreachable, it logs and
        # exits 0, and GoatCounter keeps the last database or its built-in
        # Countries one. geoipupdate writes a temporary file and renames it; a
        # 0-byte .mmdb would stop serve, so the command deletes those. Keep the
        # command free of dollar-brace placeholders: deploy-k8s.sh fills in
        # every one it finds.
        # See docs/GOATCOUNTER_OPERATIONS.md#regional-reporting.
        - name: geoipupdate
          image: maxmindinc/geoipupdate:v8.0.0@sha256:51e70dd6f16cd3e4d845ac02d09940b10772a75b9d741427d235a78570923c1d
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /data/goatcounter-data &&
              timeout 120 geoipupdate -v -d /data/goatcounter-data
              || echo 'GeoIP update skipped';
              find /data/goatcounter-data -name '*.mmdb' -size 0 -delete;
              exit 0
          env:
            - name: GEOIPUPDATE_EDITION_IDS
              value: GeoLite2-City
          # GEOIPUPDATE_ACCOUNT_ID and GEOIPUPDATE_LICENSE_KEY, created by
          # deploy-k8s.sh from MAXMIND_ACCOUNT_ID and MAXMIND_LICENSE_KEY.
          envFrom:
            - secretRef:
                name: goatcounter-geoip
                optional: true
          volumeMounts:
            - name: goatcounter-data
              mountPath: /data
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: goatcounter
          # Pinned release (multi-arch index digest); -automigrate below
          # upgrades the schema on start. Check the running version before
          # changing the pin: an older pin than the schema is a downgrade.
          # See docs/GOATCOUNTER_OPERATIONS.md#goatcounter-image-pin.
          image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
          imagePullPolicy: IfNotPresent
          # serve uses the first *.mmdb in ./goatcounter-data (the init
          # container's download) and otherwise its built-in Countries
          # database. GOATCOUNTER_DB is absolute, so nothing else moves.
          workingDir: /data
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          args:
            - serve
            - -listen
            - ":8080"
            - -automigrate
            # API calls a second from deploy-k8s.sh; gtcd paces itself to the
            # same value (deployment.yaml). GoatCounter's default is api:4/1.
            - -ratelimit
            - "api:${GOATCOUNTER_API_RATE}/1"
          env:
            - name: GOATCOUNTER_DB
              value: "sqlite+/data/db.sqlite3"
          volumeMounts:
            - name: goatcounter-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # serve runs migrations before it listens; on an upgrade they can
          # outlast the liveness probe. Up to 10 minutes before it takes over.
          startupProbe:
            httpGet:
              path: /status
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: goatcounter-data
          persistentVolumeClaim:
            claimName: goatcounter-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: goatcounter
  labels:
    app: goatcounter
spec:
  type: ClusterIP
  selector:
    app: goatcounter
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goatcounter-data
  labels:
    app: goatcounter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
