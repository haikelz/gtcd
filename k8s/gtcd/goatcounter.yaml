apiVersion: apps/v1
kind: Deployment
metadata:
  name: goatcounter
  labels:
    app: goatcounter
spec:
  replicas: 1
  # SQLite has one writer; do not overlap old/new pods during migrations.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: goatcounter
  template:
    metadata:
      labels:
        app: goatcounter
    spec:
      terminationGracePeriodSeconds: 30
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goatcounter
          # Pinned release (multi-arch index digest); -automigrate below
          # upgrades the schema on start. Check the running version before
          # changing the pin: an older pin than the schema is a downgrade.
          # See docs/GOATCOUNTER_OPERATIONS.md#goatcounter-image-pin.
          image: arp242/goatcounter:2.7.0@sha256:791df3317bf5ce379511181a4802aaf29127a318b372d4fe39ec59e1c5af44be
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          args:
            - serve
            - -listen
            - ":8080"
            - -automigrate
            # API calls a second from deploy-k8s.sh; gtcd paces itself to the
            # same value (deployment.yaml). GoatCounter's default is api:4/1.
            - -ratelimit
            - "api:${GOATCOUNTER_API_RATE}/1"
          env:
            - name: GOATCOUNTER_DB
              value: "sqlite+/data/db.sqlite3"
          volumeMounts:
            - name: goatcounter-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /status
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: goatcounter-data
          persistentVolumeClaim:
            claimName: goatcounter-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: goatcounter
  labels:
    app: goatcounter
spec:
  type: ClusterIP
  selector:
    app: goatcounter
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: goatcounter-data
  labels:
    app: goatcounter
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
