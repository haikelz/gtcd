apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtcd
  labels:
    app: gtcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtcd
  template:
    metadata:
      labels:
        app: gtcd
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gtcd
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            # Derive the public origin from the ingress proxy headers so CSRF
            # origin checks and session-cookie flags work behind TLS ingress.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: HOST_HEADER
              value: host
            - name: GOATCOUNTER_URL
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GOATCOUNTER_URL
            - name: GOATCOUNTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GOATCOUNTER_API_KEY
            - name: GTCD_ADMIN_EMAILS
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GTCD_ADMIN_EMAILS
            - name: GOATCOUNTER_ADMIN_URL
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GOATCOUNTER_ADMIN_URL
            # Optional email reports (empty values leave them off).
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_HOST
                  optional: true
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_PORT
                  optional: true
            - name: SMTP_SECURE
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_SECURE
                  optional: true
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_USER
                  optional: true
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_PASSWORD
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SMTP_FROM
                  optional: true
            - name: GTCD_PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GTCD_PUBLIC_URL
                  optional: true
            # Optional client IP header for the per-IP login rate limit.
            - name: ADDRESS_HEADER
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: ADDRESS_HEADER
                  optional: true
            - name: XFF_DEPTH
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: XFF_DEPTH
                  optional: true
            # Optional Turnstile login check (off until both keys are set).
            - name: TURNSTILE_SITE_KEY
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: TURNSTILE_SITE_KEY
                  optional: true
            - name: TURNSTILE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: TURNSTILE_SECRET_KEY
                  optional: true
            # In-cluster Redis deployed from redis.yaml in this directory.
            # REDIS_PASSWORD must precede REDIS_URL for $(VAR) expansion.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: redis://:$(REDIS_PASSWORD)@redis:6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
