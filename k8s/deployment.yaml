apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtcd
  labels:
    app: gtcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gtcd
  template:
    metadata:
      labels:
        app: gtcd
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gtcd
      containers:
        - name: gtcd
          image: ${IMAGE}
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "3000"
            - name: HOST
              value: "0.0.0.0"
            - name: NODE_ENV
              value: "production"
            - name: GOATCOUNTER_URL
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GOATCOUNTER_URL
            - name: GOATCOUNTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: GOATCOUNTER_API_KEY
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: SESSION_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gtcd-env
                  key: REDIS_URL
                  optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
