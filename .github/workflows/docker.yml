# Verify the app, then build, smoke-test, and publish the gtcd image to
# Docker Hub. Pull requests build and test only; nothing is pushed.
#
# Repository secrets:
#   DOCKER_USERNAME  Docker Hub user or organization
#   DOCKER_PASSWORD  Docker Hub access token with Read & Write scope
# Optional repository variable:
#   DOCKER_IMAGE     Image name without tag (default: <DOCKER_USERNAME>/gtcd)
#
# Actions are pinned to commit SHAs; the comment names the release.
name: docker

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:checks
      - run: pnpm build
      # Smoke tests: the built app against e2e/mock-goatcounter.mjs.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e

  image:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE || format('{0}/gtcd', secrets.DOCKER_USERNAME || 'gtcd') }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      SMOKE_TAG: gtcd:smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the arm64 smoke test needs emulation; the build stage itself runs
      # on the runner's native platform ($BUILDPLATFORM in the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.SMOKE_TAG }}

      - name: Smoke test amd64 image
        run: scripts/smoke-image.sh "$SMOKE_TAG" linux/amd64

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.DOCKER_PASSWORD }}
          username: ${{ secrets.DOCKER_USERNAME }}

      - id: push
        name: Build and push multi-arch image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test published arm64 image
        if: env.PUBLISH == 'true'
        run: scripts/smoke-image.sh "$IMAGE@$DIGEST" linux/arm64
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published $IMAGE"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
