name: docker

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 26

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test:checks
      - run: pnpm build
      # Smoke tests: the built app against e2e/mock-goatcounter.mjs.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:e2e
      - run: MOCK_MODERN_EXPORTS=true pnpm exec playwright test exports.test.ts
      - run: pnpm test:perf

  image:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ${{ vars.DOCKER_IMAGE || format('{0}/gtcd', secrets.DOCKER_USERNAME || 'gtcd') }}
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      SMOKE_TAG: gtcd:smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the arm64 smoke test needs emulation; the build stage itself runs
      # on the runner's native platform ($BUILDPLATFORM in the Dockerfile).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.SMOKE_TAG }}

      - name: Smoke test amd64 image
        run: scripts/smoke-image.sh "$SMOKE_TAG" linux/amd64

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.DOCKER_PASSWORD }}
          username: ${{ secrets.DOCKER_USERNAME }}

      - id: push
        name: Build and push multi-arch image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Smoke test published arm64 image
        if: env.PUBLISH == 'true'
        run: scripts/smoke-image.sh "$IMAGE@$DIGEST" linux/arm64
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Summary
        if: env.PUBLISH == 'true'
        run: |
          {
            echo "### Published $IMAGE"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Restart gtcd on VPS
    needs: image
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      IP: ${{ secrets.IP }}
      USERNAME: ${{ secrets.USERNAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT || '22' }}
    steps:
      - name: Restart deployment over SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${IP:?Set the IP deployment secret}"
          : "${USERNAME:?Set the USERNAME deployment secret to root}"
          : "${SSH_PRIVATE_KEY:?Set the SSH_PRIVATE_KEY deployment secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS repository secret}"
          if [[ "$USERNAME" != root ]]; then
            echo "USERNAME must be root for the gtcd Kubernetes rollout." >&2
            exit 1
          fi
          if [[ ! "$IP" =~ ^[a-zA-Z0-9][a-zA-Z0-9._:-]*$ ]]; then
            echo "IP must be a hostname or IP address." >&2
            exit 1
          fi
          if [[ ! "$VPS_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$VPS_SSH_PORT < 1 || 10#$VPS_SSH_PORT > 65535 )); then
            echo "VPS_SSH_PORT must be between 1 and 65535." >&2
            exit 1
          fi

          umask 077
          ssh_dir="$(mktemp -d "$RUNNER_TEMP/gtcd-ssh.XXXXXX")"
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          ssh -F /dev/null \
            -i "$ssh_dir/key" \
            -p "$VPS_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "$USERNAME@$IP" \
            'kubectl rollout restart deployment gtcd && kubectl rollout status deployment gtcd --timeout=180s'
